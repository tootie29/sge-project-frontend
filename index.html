<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGE CRM — Enterprise Node</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="assets/app.js"></script>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <div class="shell">
    <div class="shell-inner">
      <div class="terminal-frame">

        <!-- Top bar -->
        <header class="topbar">
          <a class="topbar-brand" :href="'#/'">
            <span class="topbar-logo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 17l6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/>
              </svg>
            </span>
            <span class="topbar-title">SGE CRM</span>
          </a>
          <div class="topbar-actions">
            <button class="icon-btn" aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </button>
            <a class="icon-btn" :href="'#/clients'" aria-label="Settings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
            <a class="btn btn-primary" :href="'#/login'" style="font-size:0.75rem; font-weight:600;">Login / Logout</a>
          </div>
        </header>

        <div class="main-area">

          <!-- Sidebar -->
          <aside class="sidebar">
            <div>
              <h2 class="sidebar-heading">Clients List</h2>
              <p class="sidebar-sub">Enterprise Node</p>
            </div>

            <div style="position:relative;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:0.5rem; top:50%; transform:translateY(-50%); color:var(--color-muted-foreground); pointer-events:none;">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input class="input" placeholder="Search clients..." x-model="sidebarFilter" style="padding-left:1.75rem;" />
            </div>

            <a class="btn btn-primary" :href="'#/action-items/new' + (clientId ? '?client_id=' + clientId : '')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              New Entry
            </a>

            <ul class="sidebar-clients">
              <template x-if="clients.length === 0 && !clientsError">
                <li style="padding: 0.75rem; font-size: 0.75rem; color: var(--color-muted-foreground);">No clients loaded.</li>
              </template>
              <template x-if="clientsError">
                <li class="alert-error" x-text="clientsError"></li>
              </template>
              <template x-for="c in filteredClients" :key="c.id">
                <li>
                  <a :href="sidebarHref(c)" :class="isClientActive(c) ? 'active' : ''" x-text="c.name || ('Client #' + c.id)"></a>
                </li>
              </template>
            </ul>

            <div class="sidebar-footer">
              <a href="#">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                Support
              </a>
              <a :href="'#/login'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </a>
            </div>
          </aside>

          <!-- Main content -->
          <main class="content">
            <!-- Tabs -->
            <nav class="tabs" x-show="tabsVisible" x-cloak>
              <template x-for="t in TABS" :key="t.href">
                <a :href="tabUrl(t.href)" :class="isTabActive(t.href) ? 'active' : ''" x-text="t.label"></a>
              </template>
            </nav>

            <div class="page">
              <!-- ========== Home ========== -->
              <template x-if="pageKey === 'home'">
                <div class="center-stack">
                  <div>
                    <span class="badge">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    </span>
                    <h1>SGE CRM</h1>
                    <p>Pick a client from the sidebar to view their Business Intelligence, Action Items, Rank Tracker, and Website Status.</p>
                  </div>
                </div>
              </template>

              <!-- ========== Action items list (HTMX) ========== -->
              <template x-if="pageKey === 'action-items'">
                <div class="stack" x-data="actionItemsList">
                  <div class="between">
                    <div>
                      <h1 class="page-title">Action Items</h1>
                      <p class="page-sub" x-text="clientName ? ('Tasks for ' + clientName + '.') : 'Manage and monitor high-priority operational tasks across the terminal node.'"></p>
                    </div>
                    <div class="toggle-group">
                      <button
                        :class="filter === 'critical' ? 'active' : ''"
                        @click="setFilter('critical')"
                      >Critical</button>
                      <button
                        :class="filter === 'regular' ? 'active' : ''"
                        @click="setFilter('regular')"
                      >Regular</button>
                    </div>
                  </div>

                  <div class="table-wrap">
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 11rem;">Datetime</th>
                          <th style="width: 7rem;">Priority</th>
                          <th style="width: 9rem;">Status</th>
                          <th>Title</th>
                          <th style="width: 6rem; text-align: right;">Flag</th>
                        </tr>
                      </thead>
                      <tbody
                        id="items-rows"
                        :hx-get="rowsUrl"
                        hx-trigger="load, refresh-rows"
                        hx-swap="innerHTML"
                      >
                        <tr class="empty-row"><td colspan="5">Loading…</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- ========== Action item detail (HTMX) ========== -->
              <template x-if="pageKey === 'action-items-detail'">
                <div
                  id="detail-root"
                  :hx-get="detailUrl"
                  hx-trigger="load"
                  hx-swap="innerHTML"
                >
                  <p class="page-sub">Loading…</p>
                </div>
              </template>

              <!-- ========== Action item new ========== -->
              <template x-if="pageKey === 'action-items-new'">
                <div class="stack" style="max-width: 40rem;" x-init="initNewForm()">
                  <div>
                    <h1 class="page-title">New action item</h1>
                    <p class="page-sub">Create a new action item and assign it to a client.</p>
                  </div>
                  <form class="stack-sm" @submit.prevent="submitNew()">
                    <div>
                      <label class="label">Title</label>
                      <input class="input" x-model="newForm.title" required />
                    </div>
                    <div>
                      <label class="label">Description</label>
                      <textarea class="input" rows="5" x-model="newForm.description" required></textarea>
                    </div>
                    <div class="grid-2">
                      <div>
                        <label class="label">Client</label>
                        <select class="input" x-model="newForm.client_id" required>
                          <option value="">Select a client</option>
                          <template x-for="c in clients" :key="c.id">
                            <option :value="c.id" x-text="c.name || ('Client #' + c.id)"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="label">Priority</label>
                        <select class="input" x-model="newForm.priority" required>
                          <option value="low">Low</option>
                          <option value="medium">Medium</option>
                          <option value="high">High</option>
                        </select>
                      </div>
                    </div>
                    <label class="row" style="font-size: 0.85rem;">
                      <input type="checkbox" x-model="newForm.critical" />
                      Mark as critical
                    </label>
                    <div class="row">
                      <button type="submit" class="btn btn-primary" :disabled="newSaving" x-text="newSaving ? 'Creating…' : 'Create action item'"></button>
                      <a class="btn btn-ghost" :href="'#/action-items' + (clientId ? '?client_id=' + clientId : '')">Cancel</a>
                    </div>
                  </form>
                </div>
              </template>

              <!-- ========== Clients page ========== -->
              <template x-if="pageKey === 'clients'">
                <div class="stack">
                  <div>
                    <h1 class="page-title">Clients</h1>
                    <p class="page-sub">All clients registered across the enterprise node.</p>
                  </div>
                  <div class="table-wrap">
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 4rem;">ID</th>
                          <th>Name</th>
                          <th>Email</th>
                          <th style="width: 10rem; text-align: right;">Action items</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="clients.length === 0">
                          <tr class="empty-row"><td colspan="4">No clients yet.</td></tr>
                        </template>
                        <template x-for="c in clients" :key="c.id">
                          <tr>
                            <td style="font-family: var(--font-mono); font-size: 0.75rem;" x-text="c.id"></td>
                            <td style="font-weight: 500;" x-text="c.name || '—'"></td>
                            <td style="color: var(--color-muted-foreground);" x-text="c.email || '—'"></td>
                            <td style="text-align: right;">
                              <a class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;" :href="'#/action-items?client_id=' + c.id">View items</a>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- ========== Stubs (BI / RT / WS) ========== -->
              <template x-if="pageKey === 'stub-bi'">
                <div class="stack-sm">
                  <h1 class="page-title">Business Intelligence</h1>
                  <p class="page-sub" x-text="clientName ? ('Insights for ' + clientName + '.') : 'Pick a client from the sidebar to view their insights.'"></p>
                  <div class="muted-box">
                    Not wired to the backend yet. The backend exposes a stub at
                    <code>DB_business_intelligence</code> in
                    <code>database.py</code> targeting the
                    <code>insights_v2</code> table — endpoints still need to be
                    added before this view can render real data per client.
                  </div>
                </div>
              </template>

              <template x-if="pageKey === 'stub-rt'">
                <div class="stack-sm">
                  <h1 class="page-title">Rank Tracker</h1>
                  <p class="page-sub" x-text="clientName ? ('Keyword rankings for ' + clientName + '.') : 'Pick a client from the sidebar to view their rankings.'"></p>
                  <div class="muted-box">
                    Not wired to the backend yet — there is no rank tracker
                    table or endpoint in the FastAPI app.
                  </div>
                </div>
              </template>

              <template x-if="pageKey === 'stub-ws'">
                <div class="stack-sm">
                  <h1 class="page-title">Website Status</h1>
                  <p class="page-sub" x-text="clientName ? ('Website availability for ' + clientName + '.') : 'Pick a client from the sidebar to view their website status.'"></p>
                  <div class="muted-box">
                    Not wired to the backend yet — placeholder for the fourth tab.
                  </div>
                </div>
              </template>

              <!-- ========== Login / Auth callback ========== -->
              <template x-if="pageKey === 'login'">
                <div class="stack" style="max-width: 28rem;">
                  <div>
                    <h1 class="page-title">Sign in</h1>
                    <p class="page-sub">
                      Authentication is not wired up yet. This page is a
                      placeholder.
                    </p>
                  </div>
                  <button class="btn btn-primary" disabled>Continue with Google (coming soon)</button>
                </div>
              </template>

              <template x-if="pageKey === 'auth-callback'">
                <div class="stack-sm">
                  <h1 class="page-title">Auth callback</h1>
                  <p class="page-sub">
                    Placeholder. This route will exchange the auth code for a
                    session once auth is wired up.
                  </p>
                </div>
              </template>
            </div>
          </main>
        </div>
      </div>
    </div>
    <p class="footnote">This content is generated for the SGE CRM admin. Do not enter sensitive information.</p>
  </div>

</body>
</html>
