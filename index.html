<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGE CRM — Enterprise Node</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="assets/app.js"></script>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <div class="app-loader" x-show="appLoading" x-cloak aria-live="polite" aria-busy="true">
    <div class="app-loader__ring" aria-hidden="true"></div>
    <p class="app-loader__label">Loading SGE CRM…</p>
  </div>

  <div class="shell">
    <div class="shell-inner">
      <div class="terminal-frame">

        <!-- Top bar -->
        <header class="topbar">
          <a class="topbar-brand" :href="'#/'">
            <span class="topbar-logo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 17l6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/>
              </svg>
            </span>
            <span class="topbar-title">SGE CRM</span>
          </a>
          <div class="topbar-actions">
            <button class="icon-btn" aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </button>
            <a class="icon-btn" :href="'#/clients'" aria-label="Settings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
            <a class="btn btn-primary" :href="'#/login'" style="font-size:0.75rem; font-weight:600;">Login / Logout</a>
          </div>
        </header>

        <div class="main-area">

          <!-- Sidebar -->
          <aside class="sidebar">
            <div>
              <h2 class="sidebar-heading">Clients List</h2>
              <p class="sidebar-sub">Enterprise Node</p>
            </div>

            <div
              style="position:relative;"
              @keydown.escape.prevent="closeSuggestions()"
              @keydown.arrow-down.prevent="moveSuggestion(1)"
              @keydown.arrow-up.prevent="moveSuggestion(-1)"
              @keydown.enter.prevent="chooseSuggestion()"
              @click.outside="closeSuggestions()"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:0.5rem; top:50%; transform:translateY(-50%); color:var(--color-muted-foreground); pointer-events:none;">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input
                class="input"
                placeholder="Search clients..."
                x-model="sidebarFilter"
                @input="sidebarPage = 1; openSuggestions()"
                @focus="openSuggestions()"
                style="padding-left:1.75rem;"
                autocomplete="off"
                role="combobox"
                :aria-expanded="suggestionsOpen && suggestions.length > 0"
                aria-controls="client-suggestion-list"
              />
              <ul
                id="client-suggestion-list"
                class="suggestion-list"
                x-show="suggestionsOpen && suggestions.length > 0"
                x-cloak
                role="listbox"
              >
                <template x-for="(s, idx) in suggestions" :key="s.id">
                  <li
                    role="option"
                    :class="['suggestion-item', idx === suggestionIndex ? 'active' : '']"
                    :aria-selected="idx === suggestionIndex"
                    @mouseenter="suggestionIndex = idx"
                    @mousedown.prevent="pickSuggestion(s)"
                  >
                    <span x-html="highlightMatch(s.name || ('Client #' + s.id), sidebarFilter)"></span>
                  </li>
                </template>
              </ul>
            </div>

            <a class="btn btn-primary" :href="'#/action-items/new' + (clientId ? '?client_id=' + clientId : '')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              New Entry
            </a>

            <div class="alphabet-strip">
              <button
                type="button"
                class="alpha-chip"
                :class="sidebarLetter === '' ? 'active' : ''"
                @click="resetSidebarFilters()"
                title="Show all clients"
              >All</button>
              <template x-for="letter in sidebarAlphabet" :key="letter">
                <button
                  type="button"
                  class="alpha-chip"
                  :class="[sidebarLetter === letter ? 'active' : '', !availableLetters.has(letter) ? 'muted' : '']"
                  :disabled="!availableLetters.has(letter)"
                  @click="setSidebarLetter(letter)"
                  x-text="letter"
                ></button>
              </template>
            </div>

            <ul class="sidebar-clients">
              <template x-if="clients.length === 0 && !clientsError">
                <li style="padding: 0.75rem; font-size: 0.75rem; color: var(--color-muted-foreground);">No clients loaded.</li>
              </template>
              <template x-if="clientsError">
                <li class="alert-error" x-text="clientsError"></li>
              </template>
              <template x-if="clients.length > 0 && filteredClients.length === 0">
                <li style="padding: 0.75rem; font-size: 0.75rem; color: var(--color-muted-foreground);">
                  No matches.
                </li>
              </template>
              <template x-for="c in pagedClients" :key="c.id">
                <li>
                  <a :href="sidebarHref(c)" :class="isClientActive(c) ? 'active' : ''" x-text="c.name || ('Client #' + c.id)"></a>
                </li>
              </template>
            </ul>

            <div class="sidebar-pagination" x-show="filteredClients.length > sidebarPageSize" x-cloak>
              <button
                type="button"
                class="alpha-chip"
                @click="prevSidebarPage()"
                :disabled="sidebarPage <= 1"
                aria-label="Previous page"
              >‹</button>
              <span class="sidebar-page-info">
                <span x-text="sidebarPage"></span> / <span x-text="sidebarTotalPages"></span>
              </span>
              <button
                type="button"
                class="alpha-chip"
                @click="nextSidebarPage()"
                :disabled="sidebarPage >= sidebarTotalPages"
                aria-label="Next page"
              >›</button>
            </div>

            <div class="sidebar-footer">
              <a href="#">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                Support
              </a>
              <a :href="'#/login'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </a>
            </div>
          </aside>

          <!-- Main content -->
          <main class="content">
            <!-- Tabs -->
            <nav class="tabs" x-show="tabsVisible" x-cloak>
              <template x-for="t in TABS" :key="t.href">
                <a :href="tabUrl(t.href)" :class="isTabActive(t.href) ? 'active' : ''" x-text="t.label"></a>
              </template>
            </nav>

            <div class="page">
              <!-- ========== Home ========== -->
              <template x-if="pageKey === 'home'">
                <div class="center-stack">
                  <div>
                    <span class="badge">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    </span>
                    <h1>SGE CRM</h1>
                    <p>Pick a client from the sidebar to view their Business Intelligence, Action Items, Rank Tracker, and Website Status.</p>
                  </div>
                </div>
              </template>

              <!-- ========== Action items list ========== -->
              <template x-if="pageKey === 'action-items'">
                <div class="stack">
                  <div class="between">
                    <div>
                      <h1 class="page-title">Action Items</h1>
                      <p class="page-sub" x-text="clientName ? ('Tasks for ' + clientName + '.') : 'Manage and monitor high-priority operational tasks across the terminal node.'"></p>
                    </div>
                    <div class="toggle-group">
                      <button :class="listFilter === 'critical' ? 'active' : ''" @click="listFilter = 'critical'">Critical</button>
                      <button :class="listFilter === 'regular' ? 'active' : ''" @click="listFilter = 'regular'">Regular</button>
                    </div>
                  </div>

                  <div class="tab-loader" x-show="pageLoading" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading action items…</span>
                  </div>

                  <div class="table-wrap" x-show="!pageLoading" x-cloak>
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 11rem;">Datetime</th>
                          <th style="width: 7rem;">Priority</th>
                          <th style="width: 9rem;">Status</th>
                          <th>Title</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="listItems.length === 0 && !pageLoading">
                          <tr class="empty-row"><td colspan="4">No <span x-text="listFilter"></span> action items.</td></tr>
                        </template>
                        <template x-for="item in listItems" :key="item.id">
                          <tr>
                            <td style="color: var(--color-muted-foreground); font-size: 0.75rem;" x-text="item.created_at ? formatDate(item.created_at) : '—'"></td>
                            <td><span :class="priorityClass(item.priority)" x-text="item.priority || '—'"></span></td>
                            <td><span :class="statusClass(item.status)" x-text="(item.status || '—').replace(/_/g, ' ')"></span></td>
                            <td>
                              <a :href="'#/action-items/' + item.id + (clientId ? '?client_id=' + clientId : '')" style="font-weight: 500;" x-text="item.title || '(untitled)'"></a>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- ========== Action item detail loader ========== -->
              <template x-if="pageKey === 'action-items-detail' && pageLoading">
                <div class="stack">
                  <a class="btn btn-ghost" :href="'#/action-items' + (clientId ? '?client_id=' + clientId : '')">← Back to list</a>
                  <div class="tab-loader" aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading action item…</span>
                  </div>
                </div>
              </template>

              <!-- ========== Action item detail ========== -->
              <template x-if="pageKey === 'action-items-detail' && detailItem && !pageLoading">
                <div class="stack">
                  <a class="btn btn-ghost" :href="'#/action-items' + (clientId ? '?client_id=' + clientId : '')">← Back to list</a>

                  <article class="card stack">
                    <div class="between">
                      <div>
                        <h1 class="page-title" x-text="detailItem.title || '(untitled)'"></h1>
                        <p class="page-sub">
                          <span style="font-family: var(--font-mono);" x-text="'#' + detailItem.id"></span>
                          <template x-if="detailItem.client">
                            <span x-text="' · ' + (detailItem.client.name || ('Client #' + detailItem.client.id))"></span>
                          </template>
                        </p>
                      </div>
                      <div class="row" style="flex-wrap: wrap;">
                        <span :class="priorityClass(detailItem.priority)" x-text="detailItem.priority || '—'"></span>
                        <span :class="statusClass(detailItem.status)" x-text="(detailItem.status || '—').replace(/_/g, ' ')"></span>
                        <template x-if="detailItem.critical">
                          <span class="pill pill-critical">Critical</span>
                        </template>
                      </div>
                    </div>

                    <p style="white-space: pre-wrap; font-size: 0.9rem;" x-text="detailItem.description || '—'"></p>

                    <div class="row">
                      <button class="btn btn-outline" @click="detailEditing = !detailEditing" x-text="detailEditing ? 'Cancel edit' : 'Edit'"></button>
                      <button class="btn btn-outline btn-danger" @click="deleteDetail()">Delete</button>
                    </div>

                    <form x-show="detailEditing" class="card stack-sm" style="padding: 1rem;" @submit.prevent="saveDetail()" x-cloak>
                      <div>
                        <label class="label">Title</label>
                        <input class="input" x-model="detailForm.title" />
                      </div>
                      <div>
                        <label class="label">Description</label>
                        <textarea class="input" rows="4" x-model="detailForm.description"></textarea>
                      </div>
                      <div class="grid-2">
                        <div>
                          <label class="label">Priority</label>
                          <select class="input" x-model="detailForm.priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                          </select>
                        </div>
                        <div>
                          <label class="label">Status</label>
                          <select class="input" x-model="detailForm.status">
                            <option value="pending">Pending</option>
                            <option value="in_progress">In progress</option>
                            <option value="ongoing">Ongoing</option>
                            <option value="requested">Requested</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="completed">Completed</option>
                          </select>
                        </div>
                      </div>
                      <label class="row" style="font-size: 0.85rem;">
                        <input type="checkbox" x-model="detailForm.critical" />
                        Critical
                      </label>
                      <button type="submit" class="btn btn-primary" :disabled="detailSaving" x-text="detailSaving ? 'Saving…' : 'Save changes'"></button>
                    </form>
                  </article>

                  <section>
                    <h2 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem;">Comments</h2>

                    <form class="card stack-sm" style="padding: 0.75rem;" @submit.prevent="postComment()">
                      <textarea class="input" rows="3" placeholder="Add a comment…" x-model="commentText" required></textarea>
                      <button type="submit" class="btn btn-primary" :disabled="commentPosting" x-text="commentPosting ? 'Posting…' : 'Post comment'" style="align-self: flex-start;"></button>
                    </form>

                    <template x-if="detailComments.length === 0">
                      <p class="page-sub" style="margin-top: 1rem;">No comments yet.</p>
                    </template>

                    <ul style="margin-top: 0.75rem; padding: 0; list-style: none;">
                      <template x-for="c in detailComments" :key="c.id">
                        <li class="comment" x-data="commentRow(c, $root._x_dataStack[0])">
                          <p class="comment-meta">
                            #<span x-text="c.id"></span>
                            <template x-if="c.created_at">
                              <span> · <span x-text="formatDate(c.created_at)"></span></span>
                            </template>
                          </p>
                          <p class="comment-body" x-text="c.text || ''"></p>

                          <div class="row" style="margin-top: 0.5rem;">
                            <button class="btn btn-ghost" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;" @click="replying = !replying" x-text="replying ? 'Cancel' : 'Reply'"></button>
                            <button class="btn btn-ghost" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;" @click="toggleThread()" :disabled="loading">
                              <span x-text="loading ? 'Loading…' : (Array.isArray(thread) ? 'Hide replies' : 'Show replies')"></span>
                            </button>
                          </div>

                          <form x-show="replying" class="stack-sm" style="margin-top: 0.5rem;" @submit.prevent="submitReply()" x-cloak>
                            <textarea class="input" rows="2" x-model="replyText" placeholder="Write a reply…" required></textarea>
                            <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Post reply</button>
                          </form>

                          <template x-if="Array.isArray(thread) && thread.length > 0">
                            <ul class="thread" style="list-style: none;">
                              <template x-for="r in thread" :key="r.id">
                                <li class="comment">
                                  <p class="comment-meta">
                                    #<span x-text="r.id"></span>
                                    <template x-if="r.created_at">
                                      <span> · <span x-text="formatDate(r.created_at)"></span></span>
                                    </template>
                                  </p>
                                  <p class="comment-body" x-text="r.text || ''"></p>
                                </li>
                              </template>
                            </ul>
                          </template>
                          <template x-if="Array.isArray(thread) && thread.length === 0">
                            <p class="page-sub" style="margin-top: 0.5rem; font-size: 0.75rem;">No replies yet.</p>
                          </template>
                        </li>
                      </template>
                    </ul>
                  </section>
                </div>
              </template>

              <!-- ========== Action item new ========== -->
              <template x-if="pageKey === 'action-items-new'">
                <div class="stack" style="max-width: 40rem;" x-init="initNewForm()">
                  <div>
                    <h1 class="page-title">New action item</h1>
                    <p class="page-sub">Create a new action item and assign it to a client.</p>
                  </div>
                  <form class="stack-sm" @submit.prevent="submitNew()">
                    <div>
                      <label class="label">Title</label>
                      <input class="input" x-model="newForm.title" required />
                    </div>
                    <div>
                      <label class="label">Description</label>
                      <textarea class="input" rows="5" x-model="newForm.description" required></textarea>
                    </div>
                    <div class="grid-2">
                      <div>
                        <label class="label">Client</label>
                        <select class="input" x-model="newForm.client_id" required>
                          <option value="">Select a client</option>
                          <template x-for="c in clients" :key="c.id">
                            <option :value="c.id" x-text="c.name || ('Client #' + c.id)"></option>
                          </template>
                        </select>
                      </div>
                      <div>
                        <label class="label">Priority</label>
                        <select class="input" x-model="newForm.priority" required>
                          <option value="low">Low</option>
                          <option value="medium">Medium</option>
                          <option value="high">High</option>
                        </select>
                      </div>
                    </div>
                    <label class="row" style="font-size: 0.85rem;">
                      <input type="checkbox" x-model="newForm.critical" />
                      Mark as critical
                    </label>
                    <div class="row">
                      <button type="submit" class="btn btn-primary" :disabled="newSaving" x-text="newSaving ? 'Creating…' : 'Create action item'"></button>
                      <a class="btn btn-ghost" :href="'#/action-items' + (clientId ? '?client_id=' + clientId : '')">Cancel</a>
                    </div>
                  </form>
                </div>
              </template>

              <!-- ========== Clients page ========== -->
              <template x-if="pageKey === 'clients'">
                <div class="stack">
                  <div>
                    <h1 class="page-title">Clients</h1>
                    <p class="page-sub">All clients registered across the enterprise node.</p>
                  </div>
                  <div class="table-wrap">
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 4rem;">ID</th>
                          <th>Name</th>
                          <th>Email</th>
                          <th style="width: 10rem; text-align: right;">Action items</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="clients.length === 0">
                          <tr class="empty-row"><td colspan="4">No clients yet.</td></tr>
                        </template>
                        <template x-for="c in clients" :key="c.id">
                          <tr>
                            <td style="font-family: var(--font-mono); font-size: 0.75rem;" x-text="c.id"></td>
                            <td style="font-weight: 500;" x-text="c.name || '—'"></td>
                            <td style="color: var(--color-muted-foreground);" x-text="c.email || '—'"></td>
                            <td style="text-align: right;">
                              <a class="btn btn-outline" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;" :href="'#/action-items?client_id=' + c.id">View items</a>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- ========== Business Intelligence ========== -->
              <template x-if="pageKey === 'stub-bi'">
                <div class="stack">
                  <div>
                    <h1 class="page-title">Business Intelligence</h1>
                    <p class="page-sub" x-text="clientName ? ('Insights for ' + clientName + '.') : 'Pick a client from the sidebar to view their insights.'"></p>
                  </div>

                  <template x-if="!clientId">
                    <div class="muted-box">Pick a client from the sidebar to view their insights.</div>
                  </template>

                  <div class="tab-loader" x-show="clientId && pageLoading" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading insights…</span>
                  </div>

                  <template x-if="clientId && !pageLoading && biCategories.length > 1">
                    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                      <template x-for="cat in biCategories" :key="cat">
                        <button
                          :class="biCategory === cat ? 'btn btn-primary' : 'btn btn-outline'"
                          style="font-size: 0.8rem;"
                          @click="setBiCategory(cat)"
                          x-text="cat"
                        ></button>
                      </template>
                    </div>
                  </template>

                  <template x-if="clientId && biItems.length === 0 && !pageLoading">
                    <div class="muted-box">No insights for this client yet.</div>
                  </template>

                  <ul x-show="clientId && !pageLoading && biFiltered.length > 0" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem;">
                    <template x-for="insight in biPaged" :key="insight.id">
                      <li class="card" style="padding: 0;">
                        <button
                          @click="toggleBI(insight.id)"
                          style="display: flex; align-items: flex-start; gap: 0.75rem; width: 100%; padding: 1rem; background: transparent; border: 0; color: inherit; text-align: left; cursor: pointer;"
                        >
                          <span
                            style="color: var(--color-primary); font-size: 1.1rem; line-height: 1.4; flex-shrink: 0; transition: transform 0.15s;"
                            :style="biExpanded[insight.id] ? 'transform: rotate(90deg);' : ''"
                          >›</span>
                          <span style="flex: 1;">
                            <span style="display: block; font-weight: 500; font-size: 0.95rem;" x-text="insight.summary || insight.content || '(no summary)'"></span>
                            <span
                              x-show="insight.created_at"
                              style="display: block; margin-top: 0.25rem; font-size: 0.7rem; color: var(--color-muted-foreground);"
                              x-text="formatDate(insight.created_at)"
                            ></span>
                          </span>
                        </button>
                        <div
                          x-show="biExpanded[insight.id]"
                          x-cloak
                          style="padding: 0 1rem 1rem 2.5rem; font-size: 0.9rem; color: var(--color-muted-foreground); white-space: pre-wrap;"
                          x-text="insight.content"
                        ></div>
                      </li>
                    </template>
                  </ul>

                  <div
                    x-show="clientId && biFiltered.length > biPageSize"
                    x-cloak
                    style="display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding-top: 0.5rem;"
                  >
                    <p class="page-sub" style="margin: 0;">
                      Showing <span x-text="(biPage - 1) * biPageSize + 1"></span>–<span x-text="Math.min(biPage * biPageSize, biFiltered.length)"></span>
                      of <span x-text="biFiltered.length"></span>
                    </p>
                    <div class="row">
                      <button class="btn btn-outline" style="font-size: 0.8rem;" @click="prevBiPage()" :disabled="biPage <= 1">‹ Previous</button>
                      <span class="page-sub" style="min-width: 4.5rem; text-align: center;">
                        Page <span x-text="biPage"></span> / <span x-text="biTotalPages"></span>
                      </span>
                      <button class="btn btn-outline" style="font-size: 0.8rem;" @click="nextBiPage()" :disabled="biPage >= biTotalPages">Next ›</button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ========== Reports list ========== -->
              <template x-if="pageKey === 'reports'">
                <div class="stack">
                  <div class="between">
                    <div>
                      <h1 class="page-title">Reports</h1>
                      <p class="page-sub" x-text="clientName ? ('Submitted reports for ' + clientName + '.') : 'Pick a client from the sidebar to view their reports.'"></p>
                    </div>
                    <button class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 0.6rem;" @click="loadReports()" :disabled="reportsLoading" aria-label="Refresh">
                      <span x-text="reportsLoading ? '…' : '↻'"></span>
                    </button>
                  </div>

                  <template x-if="!clientId">
                    <div class="muted-box">Pick a client from the sidebar to view their reports.</div>
                  </template>

                  <div class="tab-loader" x-show="clientId && (pageLoading || reportsLoading)" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading reports…</span>
                  </div>

                  <template x-if="clientId && reportsItems.length === 0 && !reportsLoading && !pageLoading">
                    <div class="muted-box">No reports for this client yet.</div>
                  </template>

                  <div x-show="clientId && !pageLoading && !reportsLoading && reportsItems.length > 0" class="table-wrap" x-cloak>
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 11rem;">Datetime</th>
                          <th>Title</th>
                          <th style="width: 7rem; text-align: right;">Files</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="report in reportsPaged" :key="report.id">
                          <tr>
                            <td style="color: var(--color-muted-foreground); font-size: 0.75rem;" x-text="report.created_at ? formatDate(report.created_at) : '—'"></td>
                            <td>
                              <a :href="'#/reports/' + report.id + (clientId ? '?client_id=' + clientId : '')" style="font-weight: 500;" x-text="report.title || '(untitled)'"></a>
                            </td>
                            <td style="text-align: right; color: var(--color-muted-foreground); font-size: 0.8rem;" x-text="reportFileUrls(report).length"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <div
                    x-show="clientId && reportsItems.length > reportsPageSize"
                    x-cloak
                    style="display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding-top: 0.5rem;"
                  >
                    <p class="page-sub" style="margin: 0;">
                      Showing <span x-text="(reportsPage - 1) * reportsPageSize + 1"></span>–<span x-text="Math.min(reportsPage * reportsPageSize, reportsItems.length)"></span>
                      of <span x-text="reportsItems.length"></span>
                    </p>
                    <div class="row">
                      <button class="btn btn-outline" style="font-size: 0.8rem;" @click="prevReportsPage()" :disabled="reportsPage <= 1">‹ Previous</button>
                      <span class="page-sub" style="min-width: 4.5rem; text-align: center;">
                        Page <span x-text="reportsPage"></span> / <span x-text="reportsTotalPages"></span>
                      </span>
                      <button class="btn btn-outline" style="font-size: 0.8rem;" @click="nextReportsPage()" :disabled="reportsPage >= reportsTotalPages">Next ›</button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ========== Report detail + reviews ========== -->
              <template x-if="pageKey === 'reports-detail'">
                <div class="stack">
                  <a class="btn btn-ghost" :href="'#/reports' + (clientId ? '?client_id=' + clientId : '')">← Back to reports</a>

                  <div class="tab-loader" x-show="pageLoading || reportLoading" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading report…</span>
                  </div>

                  <template x-if="reportDetail">
                    <article class="card stack">
                      <div>
                        <h1 class="page-title" x-text="reportDetail.title || '(untitled)'"></h1>
                        <p class="page-sub">
                          <span style="font-family: var(--font-mono);" x-text="'#' + reportDetail.id"></span>
                          <template x-if="reportDetail.client">
                            <span x-text="' · ' + (reportDetail.client.name || ('Client #' + reportDetail.client.id))"></span>
                          </template>
                          <template x-if="reportDetail.created_at">
                            <span x-text="' · ' + formatDate(reportDetail.created_at)"></span>
                          </template>
                        </p>
                      </div>

                      <p style="white-space: pre-wrap; font-size: 0.9rem;" x-text="reportDetail.content || '—'"></p>

                      <template x-if="reportFileUrls(reportDetail).length > 0">
                        <div class="stack-sm">
                          <h2 style="font-size: 0.9rem; font-weight: 600; margin: 0;">Attachments</h2>
                          <ul style="margin: 0; padding-left: 1.25rem;">
                            <template x-for="(f, idx) in reportFileUrls(reportDetail)" :key="idx">
                              <li>
                                <a :href="f.url" target="_blank" rel="noopener" style="color: var(--color-primary); text-decoration: underline; word-break: break-all;" x-text="f.url"></a>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </article>
                  </template>

                  <section x-show="reportDetail" x-cloak>
                    <h2 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem;">Reviews</h2>

                    <form class="card stack-sm" style="padding: 0.75rem;" @submit.prevent="postReview()">
                      <textarea class="input" rows="3" placeholder="Add a review…" x-model="reviewText" required></textarea>
                      <button type="submit" class="btn btn-primary" :disabled="reviewPosting" x-text="reviewPosting ? 'Posting…' : 'Post review'" style="align-self: flex-start;"></button>
                    </form>

                    <template x-if="reportReviews.length === 0">
                      <p class="page-sub" style="margin-top: 1rem;">No reviews yet.</p>
                    </template>

                    <ul style="margin-top: 0.75rem; padding: 0; list-style: none;">
                      <template x-for="rv in reportReviews" :key="rv.id">
                        <li class="comment">
                          <p class="comment-meta">
                            #<span x-text="rv.id"></span>
                            <template x-if="rv.created_at">
                              <span> · <span x-text="formatDate(rv.created_at)"></span></span>
                            </template>
                          </p>
                          <p class="comment-body" x-text="rv.content || ''"></p>
                        </li>
                      </template>
                    </ul>
                  </section>
                </div>
              </template>

              <template x-if="pageKey === 'stub-rt'">
                <div class="stack">
                  <div class="between">
                    <div>
                      <h1 class="page-title">Rank Tracker</h1>
                      <p class="page-sub" x-text="clientName ? ('Keyword rankings for ' + clientName + '.') : 'Pick a client from the sidebar to view their rankings.'"></p>
                    </div>
                    <div class="row">
                      <button class="btn btn-outline" style="font-size: 0.8rem;" @click="loadRankTracker()" :disabled="rtLoading">
                        <span x-text="rtLoading ? 'Refreshing…' : '↓ Export Data'"></span>
                      </button>
                      <button class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 0.6rem;" @click="loadRankTracker()" :disabled="rtLoading" aria-label="Refresh">↻</button>
                    </div>
                  </div>

                  <template x-if="!clientId">
                    <div class="muted-box">Pick a client from the sidebar to view their rankings.</div>
                  </template>

                  <div class="tab-loader" x-show="clientId && (pageLoading || rtLoading)" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading rank tracker…</span>
                  </div>

                  <template x-if="clientId && rtBackendMissing && !rtLoading && !pageLoading">
                    <div class="muted-box">
                      <p style="margin: 0 0 0.5rem 0; color: var(--color-foreground);"><strong>Backend endpoint not yet implemented.</strong></p>
                      <p style="margin: 0 0 0.5rem 0;">Expected:</p>
                      <pre style="margin: 0 0 0.5rem 0; font-size: 0.75rem; background: var(--color-muted); padding: 0.5rem; border-radius: var(--radius);">GET /rank-tracker/client/{id}

[{
  "id": 1,
  "keyword": "Emergency Dentist Maui",
  "rank": "Page 1 (1)",
  "page_path": "/emergency-dentistry",
  "change": 1
}, ...]</pre>
                      <p style="margin: 0;">When this endpoint lands in <code>sge-project-001/main.py</code>, this view will populate automatically.</p>
                    </div>
                  </template>

                  <template x-if="clientId && !rtBackendMissing && rtItems.length === 0 && !rtLoading && !pageLoading">
                    <div class="muted-box">No keyword rankings for this client yet.</div>
                  </template>

                  <div x-show="clientId && !rtLoading && !pageLoading && rtItems.length > 0" class="table-wrap" x-cloak>
                    <table class="data">
                      <thead>
                        <tr>
                          <th style="width: 8rem;">Rank</th>
                          <th>Keywords</th>
                          <th>Page</th>
                          <th style="width: 6rem; text-align: right;">Change</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="row in rtItems" :key="row.id">
                          <tr>
                            <td style="color: var(--color-primary); font-family: var(--font-mono); font-size: 0.8rem;" x-text="row.rank || '—'"></td>
                            <td style="font-weight: 500;" x-text="row.keyword || '—'"></td>
                            <td>
                              <a :href="row.page_url || '#'" style="color: var(--color-primary); text-decoration: underline;" x-text="row.page_path || row.page || '—'"></a>
                            </td>
                            <td style="text-align: right;">
                              <span :class="rtChangeClass(row.change)" x-text="rtChangeLabel(row.change)"></span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <template x-if="pageKey === 'stub-ws'">
                <div class="stack">
                  <div class="between">
                    <div>
                      <h1 class="page-title">Website Status</h1>
                      <p class="page-sub" x-text="clientName ? ('Website availability for ' + clientName + '.') : 'Pick a client from the sidebar to view their website status.'"></p>
                    </div>
                    <button class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 0.6rem;" @click="loadWebsiteStatus()" :disabled="wsLoading" aria-label="Refresh">
                      <span x-text="wsLoading ? '…' : '↻'"></span>
                    </button>
                  </div>

                  <template x-if="!clientId">
                    <div class="muted-box">Pick a client from the sidebar to view their website status.</div>
                  </template>

                  <div class="tab-loader" x-show="clientId && (pageLoading || wsLoading)" x-cloak aria-live="polite" aria-busy="true">
                    <span class="tab-loader__dots" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>Loading website status…</span>
                  </div>

                  <template x-if="clientId && wsBackendMissing && !wsLoading && !pageLoading">
                    <div class="muted-box">
                      <p style="margin: 0 0 0.5rem 0; color: var(--color-foreground);"><strong>Backend endpoint not yet implemented.</strong></p>
                      <p style="margin: 0 0 0.5rem 0;">Expected:</p>
                      <pre style="margin: 0 0 0.5rem 0; font-size: 0.75rem; background: var(--color-muted); padding: 0.5rem; border-radius: var(--radius);">GET /website-status/client/{id}

[{
  "id": 1,
  "url": "https://example.com/contact",
  "status": "up",          // up | degraded | down
  "status_code": 200,
  "response_time_ms": 245,
  "last_checked": "2026-05-13T15:00:00Z"
}, ...]</pre>
                      <p style="margin: 0;">When this endpoint lands in <code>sge-project-001/main.py</code>, this view will populate automatically.</p>
                    </div>
                  </template>

                  <template x-if="clientId && !wsBackendMissing && wsItems.length === 0 && !wsLoading && !pageLoading">
                    <div class="muted-box">No website checks for this client yet.</div>
                  </template>

                  <div x-show="clientId && !wsLoading && !pageLoading && wsItems.length > 0" class="table-wrap" x-cloak>
                    <table class="data">
                      <thead>
                        <tr>
                          <th>URL</th>
                          <th style="width: 8rem;">Status</th>
                          <th style="width: 6rem;">Code</th>
                          <th style="width: 8rem; text-align: right;">Response</th>
                          <th style="width: 12rem; text-align: right;">Last checked</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="row in wsItems" :key="row.id">
                          <tr>
                            <td style="font-weight: 500;">
                              <a :href="row.url" target="_blank" rel="noopener" style="color: var(--color-primary); text-decoration: underline;" x-text="row.url || '—'"></a>
                            </td>
                            <td><span :class="wsStatusClass(row.status)" x-text="row.status || '—'"></span></td>
                            <td><span :class="wsCodeClass(row.status_code)" x-text="row.status_code ?? '—'"></span></td>
                            <td style="text-align: right; font-family: var(--font-mono); font-size: 0.8rem;">
                              <span x-text="row.response_time_ms != null ? row.response_time_ms + ' ms' : '—'"></span>
                            </td>
                            <td style="text-align: right; color: var(--color-muted-foreground); font-size: 0.8rem;" x-text="formatDate(row.last_checked)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- ========== Login / Auth callback ========== -->
              <template x-if="pageKey === 'login'">
                <div class="stack" style="max-width: 28rem;">
                  <div>
                    <h1 class="page-title">Sign in</h1>
                    <p class="page-sub">
                      Authentication is not wired up yet. This page is a
                      placeholder.
                    </p>
                  </div>
                  <button class="btn btn-primary" disabled>Continue with Google (coming soon)</button>
                </div>
              </template>

              <template x-if="pageKey === 'auth-callback'">
                <div class="stack-sm">
                  <h1 class="page-title">Auth callback</h1>
                  <p class="page-sub">
                    Placeholder. This route will exchange the auth code for a
                    session once auth is wired up.
                  </p>
                </div>
              </template>
            </div>
          </main>
        </div>
      </div>
    </div>
    <p class="footnote">This content is generated for the SGE CRM admin. Do not enter sensitive information.</p>
  </div>

</body>
</html>
